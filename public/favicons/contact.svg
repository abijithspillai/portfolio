<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4155" />
      <stop offset="100%" stop-color="#e50914" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e50914" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0d14" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#222838" stroke-width="1.5" />
  <!-- Envelope Body -->
  <rect x="11" y="20" width="42" height="28" rx="5" fill="#121622" stroke="#ffffff" stroke-width="3.5" />
