      <stop offset="0%" stop-color="#ff4155" />
      <stop offset="100%" stop-color="#e50914" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e50914" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0d14" />
